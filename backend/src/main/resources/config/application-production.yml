spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/${FIREWOLF_DB_NAME}?character_set_server=utf8mb4
    username: ${FIREWOLF_DB_USERNAME}
    password: ${FIREWOLF_DB_PASSWORD}
    driverClassName: com.mysql.cj.jdbc.Driver
    type: org.apache.tomcat.jdbc.pool.DataSource
    tomcat:
      # wolf-db は全アプリで共有しており接続数上限も有限なため、
      # プール上限を明示して DB への同時接続数を固定する（全アプリの配分と根拠は h-orito/firewolf#3 を参照）。
      # 上限到達時は max-wait まで待ち、取得できなければ PoolExhaustedException になる
      max-active: 40
      max-idle: 40
      min-idle: 5
      initial-size: 5
      max-wait: 10000
      # アイドル接続が MySQL 側 (wait_timeout) で切られていても掴まないよう、貸出時に検証する
      test-on-borrow: true
      validation-query: SELECT 1
      validation-interval: 30000
  messages:
    basename: messages
    cache-duration: -1
    encoding: UTF-8
  jackson:
    property-naming-strategy: SNAKE_CASE
  cache:
    caffeine:
      spec: "expireAfterAccess=600s"
security:
  corsClientUrls:
    - https://firewolf.netlify.app
    - https://wolfort.dev/firewolf
    - https://feature-nuxt4--firewolf.netlify.app
server:
  port: 8087
  servlet:
    context-path: /firewolf-api
    session:
      timeout: 86400
  compression:
    enabled: true
  tomcat:
    basedir: /app/logs
    accesslog:
      enabled: true
      suffix: .log
      prefix: firewolf-access_log
      file-date-format: .yyyy-MM-dd
      max-days: 14
      pattern: '%t "%r" %s %b "%{Referer}i" "%{User-Agent}i" %{X-Forwarded-For}i %D %S %I'
    remoteip.remote-ip-header: true
    use-forward-headers: true
logging:
  level:
    org.springframework: INFO
    root: INFO
    org.seasar.dbflute: ERROR
  file.name: /app/logs/firewolf.log

slack.token: ${SLACK_TOKEN}
twitter:
  oauth:
    consumer-key: ${TWITTER_CONSUMER_KEY}
    consumer-secret: ${TWITTER_CONSUMER_SECRET}
    access-token: ${TWITTER_ACCESS_TOKEN}
    access-token-secret: ${TWITTER_ACCESS_TOKEN_SECRET}

firebase:
  adminsdk:
    secretkey:
      path: ${FIREWOLF_FIREBASE_ADMINSDK_PATH}
  database:
    url: ${FIREWOLF_FIREBASE_DATABASE_URL}

discord:
  webhook-url: ${FIREWOLF_DISCORD_WEBHOOK_URL}
  master-userid: ${FIREWOLF_DISCORD_MASTER_USERID}
